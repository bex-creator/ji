<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wave Dash</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,900;1,900&display=swap');
        body { font-family: 'Montserrat', sans-serif; overflow: hidden; touch-action: none; background-color: #020617; }
        canvas { 
            image-rendering: optimizeSpeed; 
        }
    </style>
</head>
<body class="w-screen h-screen flex items-center justify-center text-white select-none overflow-hidden bg-[#05020a]">

    <!-- Game Container -->
    <div class="relative w-full h-full flex items-center justify-center">
        
        <!-- The Canvas -->
        <canvas id="gameCanvas" class="absolute inset-0 w-full h-full"></canvas>

        <!-- UI Overlays -->
        <div id="uiLayer" class="absolute inset-0 pointer-events-none flex flex-col items-center justify-center z-10">
            
            <!-- In-Game HUD -->
            <div id="hud" class="absolute top-8 left-0 right-0 flex justify-center opacity-0 transition-opacity duration-300">
                <div class="bg-slate-900/80 backdrop-blur px-6 py-2 rounded-full border border-slate-700 shadow-lg">
                    <span class="text-slate-400 font-bold tracking-widest text-sm uppercase">Score</span>
                    <span id="scoreDisplay" class="ml-3 text-3xl font-black text-cyan-400 drop-shadow-[0_0_8px_rgba(6,182,212,0.8)]">0</span>
                </div>
            </div>

            <!-- Main Menu -->
            <div id="startMenu" class="pointer-events-auto flex flex-col items-center justify-center bg-slate-900/90 backdrop-blur-md absolute inset-0 transition-opacity duration-500">
                <h1 class="text-6xl md:text-8xl font-black text-transparent bg-clip-text bg-gradient-to-r from-pink-500 to-cyan-500 mb-2 italic tracking-tighter drop-shadow-[0_0_15px_rgba(236,72,153,0.5)]">WAVE DASH</h1>
                <p class="text-slate-400 mb-8 text-lg md:text-xl font-medium tracking-wide animate-pulse">Hold to fly UP, Release to dive DOWN</p>
                
                <!-- Difficulty Selector -->
                <div class="flex flex-wrap justify-center gap-3 mb-10" id="diffSelector">
                    <button class="diff-btn px-5 py-2 rounded-full border-2 border-emerald-500 text-emerald-500 hover:bg-white/10 font-black tracking-wider transition-all" data-diff="EASY">EASY</button>
                    <button class="diff-btn px-5 py-2 rounded-full border-2 border-cyan-500 bg-cyan-500 text-slate-900 font-black tracking-wider transition-all" data-diff="NORMAL">NORMAL</button>
                    <button class="diff-btn px-5 py-2 rounded-full border-2 border-orange-500 text-orange-500 hover:bg-white/10 font-black tracking-wider transition-all" data-diff="HARD">HARD</button>
                    <button class="diff-btn px-5 py-2 rounded-full border-2 border-red-500 text-red-500 hover:bg-white/10 font-black tracking-wider transition-all" data-diff="EXTREME">EXTREME</button>
                </div>

                <button id="startBtn" class="group relative px-10 py-5 bg-emerald-500 text-slate-900 font-black text-2xl md:text-3xl rounded-full shadow-[0_0_30px_rgba(16,185,129,0.4)] hover:shadow-[0_0_50px_rgba(16,185,129,0.8)] transition-all transform hover:scale-105 active:scale-95 overflow-hidden">
                    <span class="relative z-10">INITIALIZE</span>
                    <div class="absolute inset-0 bg-white/20 transform -skew-x-12 -translate-x-full group-hover:animate-[shimmer_0.5s_forwards]"></div>
                </button>
            </div>

            <!-- Game Over Menu -->
            <div id="gameOverMenu" class="pointer-events-auto hidden flex-col items-center justify-center bg-red-950/90 backdrop-blur-md absolute inset-0 transition-opacity duration-500">
                <h2 class="text-5xl md:text-7xl font-black text-red-500 mb-4 italic tracking-widest drop-shadow-[0_0_15px_rgba(239,68,68,0.8)]">CRASHED!</h2>
                <div class="flex items-center gap-4 mb-10 text-2xl md:text-3xl">
                    <span class="text-slate-300 font-medium">Final Score:</span>
                    <span id="finalScore" class="font-black text-white">0</span>
                </div>
                <button id="restartBtn" class="px-10 py-5 bg-white text-red-900 font-black text-2xl md:text-3xl rounded-full shadow-[0_0_30px_rgba(255,255,255,0.4)] hover:shadow-[0_0_50px_rgba(255,255,255,0.8)] transition-all transform hover:scale-105 active:scale-95">
                    TRY AGAIN
                </button>
            </div>

        </div>
    </div>

    <style>
        @keyframes shimmer {
            100% { transform: translateX(100%); }
        }
    </style>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // UI Elements
        const startMenu = document.getElementById('startMenu');
        const gameOverMenu = document.getElementById('gameOverMenu');
        const hud = document.getElementById('hud');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const finalScore = document.getElementById('finalScore');
        
        // Game State Variables
        let CANVAS_W = window.innerWidth;
        let CANVAS_H = window.innerHeight;
        const SEGMENT_WIDTH = 100; // Must match player speed for 45-degree slope ratio
        let PLAYER_SPEED = 8;    // Forward speed AND vertical speed
        
        // Difficulty Settings
        const DIFFICULTY_CONFIG = {
            EASY: { speed: 5.5, startGap: 450, minGap: 150, obsTimerBase: 400, colorBtn: 'bg-emerald-500', colorText: 'text-emerald-500' },
            NORMAL: { speed: 8, startGap: 350, minGap: 90, obsTimerBase: 250, colorBtn: 'bg-cyan-500', colorText: 'text-cyan-500' },
            HARD: { speed: 11, startGap: 280, minGap: 65, obsTimerBase: 150, colorBtn: 'bg-orange-500', colorText: 'text-orange-500' },
            EXTREME: { speed: 15, startGap: 220, minGap: 45, obsTimerBase: 80, colorBtn: 'bg-red-500', colorText: 'text-red-500' }
        };
        let currentDifficulty = 'NORMAL';

        // Game State
        let state = 'MENU'; // MENU, PLAYING, GAMEOVER
        let score = 0;
        let isHolding = false;
        let gravityInverted = false;
        let screenFlash = 0;
        
        // World Generation State
        let terrain = [];
        let terrainXOffset = 0;
        let currentCenterY = CANVAS_H / 2;
        let currentGap = 350;
        let pattern = 'FLAT';
        let patternSteps = 0;
        let slopeDir = 1;
        
        // Entities
        let player = { x: Math.min(200, CANVAS_W * 0.3), y: CANVAS_H / 2, size: 8 };
        let trail = [];
        let particles = [];
        let obstacles = [];
        let obstacleTimer = 0;

        // --- Visual Enhancements ---
        let globalHue = 0;
        let stars = [];
        
        function initStars() {
            stars = [];
            let numStars = Math.floor((CANVAS_W * CANVAS_H) / 4000);
            for(let i=0; i<numStars; i++) {
                stars.push({
                    x: Math.random() * CANVAS_W,
                    y: Math.random() * CANVAS_H,
                    size: Math.random() * 2 + 0.2,
                    speed: Math.random() * 0.8 + 0.1
                });
            }
        }

        function resize() {
            CANVAS_W = window.innerWidth;
            CANVAS_H = window.innerHeight;
            canvas.width = CANVAS_W;
            canvas.height = CANVAS_H;
            player.x = Math.min(200, CANVAS_W * 0.3);
            if(state === 'MENU') {
                player.y = CANVAS_H / 2;
                currentCenterY = CANVAS_H / 2;
            }
            initStars();
        }
        
        window.addEventListener('resize', resize);
        resize(); // Initialize sizes

        // --- Core Engine & Generation ---

        function getNextTerrainSegment() {
            // Pattern logic to generate enjoyable wave tunnels
            if (patternSteps <= 0) {
                let r = Math.random();
                if (r < 0.10) {
                    pattern = 'FLAT'; 
                    patternSteps = 1 + Math.floor(Math.random() * 2);
                } else if (r < 0.45) {
                    pattern = 'CHAOS'; // Unpredictable random jukes
                    patternSteps = 3 + Math.floor(Math.random() * 6);
                } else if (r < 0.60) {
                    pattern = 'ZIGZAG'; 
                    patternSteps = 2 + Math.floor(Math.random() * 4); // Short bursts
                } else if (r < 0.75) {
                    pattern = 'ASCEND'; 
                    patternSteps = 1 + Math.floor(Math.random() * 3);
                } else if (r < 0.90) {
                    pattern = 'DESCEND'; 
                    patternSteps = 1 + Math.floor(Math.random() * 3);
                } else {
                    pattern = 'CHOKE';
                    patternSteps = 2 + Math.floor(Math.random() * 3);
                }
            }

            let dir = 0;
            let stepGap = currentGap;

            if (pattern === 'ZIGZAG') {
                dir = (patternSteps % 2 === 0) ? 1 : -1;
            } else if (pattern === 'ASCEND') {
                dir = -1;
            } else if (pattern === 'DESCEND') {
                dir = 1;
            } else if (pattern === 'CHOKE') {
                dir = Math.floor(Math.random() * 3) - 1; // -1, 0, or 1
                stepGap = currentGap * (0.35 + Math.random() * 0.3); // 35% to 65% of current gap! Very sudden.
            } else if (pattern === 'CHAOS') {
                dir = Math.floor(Math.random() * 3) - 1; // Randomly go up, down, or straight
            }
            patternSteps--;

            // Bounce off boundaries to keep tunnel in screen
            const padding = 50 + (stepGap / 2);
            if (currentCenterY + (dir * SEGMENT_WIDTH) < padding) { 
                dir = 1; 
                // Sometimes force a dive, sometimes let chaos resume
                if (Math.random() > 0.5) { pattern = 'DESCEND'; patternSteps = 2; }
            }
            if (currentCenterY + (dir * SEGMENT_WIDTH) > CANVAS_H - padding) { 
                dir = -1; 
                if (Math.random() > 0.5) { pattern = 'ASCEND'; patternSteps = 2; }
            }

            currentCenterY += (dir * SEGMENT_WIDTH);
            
            // Difficulty scaling with organic expanding/contracting (wobble)
            const config = DIFFICULTY_CONFIG[currentDifficulty];
            const maxSafeGap = CANVAS_H * 0.75; // Prevent gaps larger than the screen
            const baseTargetGap = Math.max(config.minGap, Math.min(maxSafeGap, config.startGap - (score / 12)));
            const wobble = Math.sin(score / 10) * 60; // Tunnel breathes in and out
            const targetGap = Math.max(config.minGap, Math.min(maxSafeGap, baseTargetGap + wobble));
            
            // Smooth gap transitions for non-choke patterns
            if (pattern !== 'CHOKE') {
                currentGap += (targetGap - currentGap) * 0.15;
            }

            return {
                top: currentCenterY - stepGap / 2,
                bottom: currentCenterY + stepGap / 2
            };
        }

        function initGame() {
            state = 'PLAYING';
            score = 0;
            isHolding = false;
            
            // Apply Difficulty Settings
            const config = DIFFICULTY_CONFIG[currentDifficulty];
            PLAYER_SPEED = config.speed;

            // Reset Player
            player.y = CANVAS_H / 2;
            trail = [];
            particles = [];
            obstacles = [];
            obstacleTimer = config.obsTimerBase;
            gravityInverted = false;
            screenFlash = 0;
            
            // Reset Terrain
            terrain = [];
            terrainXOffset = 0;
            currentCenterY = CANVAS_H / 2;
            currentGap = Math.min(config.startGap, CANVAS_H * 0.6); // Scale starting gap for smaller screens
            patternSteps = 5;
            pattern = 'FLAT';
            
            // Pre-fill terrain array
            const numSegments = Math.ceil(CANVAS_W / SEGMENT_WIDTH) + 2;
            for(let i = 0; i < numSegments; i++) {
                if(i < 4) {
                    // Start completely flat and safe
                    terrain.push({ top: currentCenterY - currentGap/2, bottom: currentCenterY + currentGap/2 });
                } else {
                    terrain.push(getNextTerrainSegment());
                }
            }

            // Update UI
            startMenu.classList.add('hidden');
            gameOverMenu.classList.add('hidden');
            hud.classList.remove('opacity-0');
        }

        function die() {
            state = 'GAMEOVER';
            
            // Explode into particles
            for(let i=0; i<50; i++) {
                particles.push({
                    x: player.x,
                    y: player.y,
                    vx: (Math.random() - 0.5) * 25,
                    vy: (Math.random() - 0.5) * 25,
                    size: Math.random() * 10 + 4,
                    color: `hsl(${globalHue + (Math.random()*60 - 30)}, 100%, 60%)`,
                    life: 1.0
                });
            }

            // Update UI
            hud.classList.add('opacity-0');
            finalScore.innerText = Math.floor(score);
            setTimeout(() => {
                gameOverMenu.classList.remove('hidden');
                gameOverMenu.classList.add('flex');
            }, 500); // Delay menu slightly for explosion effect
        }

        // --- Logic Update ---

        function update() {
            if (state === 'PLAYING') {
                score += 0.2;
                scoreDisplay.innerText = Math.floor(score);

                // Move Player Y (Wave mechanic + Gravity handling)
                let moveDir = isHolding ? -1 : 1;
                if (gravityInverted) moveDir *= -1;
                player.y += moveDir * PLAYER_SPEED;

                // Update Trail
                trail.push({ x: player.x, y: player.y });
                if (trail.length > 25) trail.shift();
                // Move trail backwards to match world
                for (let i = 0; i < trail.length; i++) {
                    trail[i].x -= PLAYER_SPEED;
                }

                // Move World Left
                terrainXOffset += PLAYER_SPEED;
                if (terrainXOffset >= SEGMENT_WIDTH) {
                    terrain.shift();
                    terrain.push(getNextTerrainSegment());
                    terrainXOffset -= SEGMENT_WIDTH;
                }

                // Collision Detection
                // Calculate exactly which segment the player is currently inside
                const relativeX = player.x + terrainXOffset;
                const segmentIndex = Math.floor(relativeX / SEGMENT_WIDTH);
                const t = (relativeX % SEGMENT_WIDTH) / SEGMENT_WIDTH; // Local interpolation ratio (0 to 1)

                if (segmentIndex >= 0 && segmentIndex < terrain.length - 1) {
                    // Linear interpolation to find the exact boundary Y at the player's X
                    const currentTop = terrain[segmentIndex].top * (1 - t) + terrain[segmentIndex + 1].top * t;
                    const currentBottom = terrain[segmentIndex].bottom * (1 - t) + terrain[segmentIndex + 1].bottom * t;

                    // Approximate player radius check
                    if (player.y - player.size < currentTop || player.y + player.size > currentBottom) {
                        die();
                    }
                }
                
                // Obstacle Generation
                obstacleTimer -= PLAYER_SPEED;
                if (obstacleTimer <= 0 && score > 5) {
                    let rightTop = terrain[terrain.length-1].top;
                    let rightBottom = terrain[terrain.length-1].bottom;
                    let center = (rightTop + rightBottom) / 2;
                    let gap = rightBottom - rightTop;
                    
                    // Only spawn if gap is decently wide and pattern isn't a tight choke
                    if (gap > 180 && pattern !== 'CHOKE') {
                        let typeRnd = Math.random();
                        
                        if (typeRnd < 0.15) { // 15% chance for a Gravity Portal
                            obstacles.push({
                                x: CANVAS_W + 100,
                                y: center,
                                w: 40, h: gap * 0.9,
                                type: 'portal_grav',
                                passed: false,
                                color: gravityInverted ? '#3b82f6' : '#a855f7' // Blue if returning, Purple if inverting
                            });
                        } else if (typeRnd < 0.45) { // 30% chance Static Box
                            let size = 40 + Math.random() * 40;
                            obstacles.push({
                                x: CANVAS_W + 100,
                                y: center + (Math.random() - 0.5) * (gap * 0.4),
                                w: size, h: size,
                                type: 'box',
                                color: `hsl(${(globalHue + 60) % 360}, 100%, 60%)` 
                            });
                        } else if (typeRnd < 0.75) { // 30% chance Sawblade
                            let radius = 25 + Math.random() * 20;
                            obstacles.push({
                                x: CANVAS_W + 100,
                                y: center + (Math.random() - 0.5) * (gap * 0.5),
                                r: radius,
                                type: 'sawblade',
                                rot: 0,
                                speed: (Math.random() > 0.5 ? 1 : -1) * (0.08 + Math.random() * 0.08),
                                color: '#ef4444' // Red
                            });
                        } else { // 25% chance Moving Gate
                            let width = 30 + Math.random() * 20;
                            let height = gap * (0.3 + Math.random() * 0.2);
                            obstacles.push({
                                x: CANVAS_W + 100,
                                y: center,
                                baseY: center,
                                w: width, h: height,
                                type: 'gate',
                                phase: Math.random() * Math.PI * 2,
                                speed: 0.03 + Math.random() * 0.04,
                                amp: gap * 0.25,
                                color: `hsl(${(globalHue + 120) % 360}, 100%, 60%)`
                            });
                        }
                    }
                    obstacleTimer = DIFFICULTY_CONFIG[currentDifficulty].obsTimerBase + Math.random() * 300; 
                }

                // Update Obstacles & Check Collisions
                for (let i = obstacles.length - 1; i >= 0; i--) {
                    let obs = obstacles[i];
                    obs.x -= PLAYER_SPEED;
                    
                    if (obs.type === 'gate') {
                        obs.y = obs.baseY + Math.sin(obs.phase) * obs.amp;
                        obs.phase += obs.speed;
                    } else if (obs.type === 'sawblade') {
                        obs.rot += obs.speed;
                    }

                    if (obs.x + 100 < 0) {
                        obstacles.splice(i, 1);
                        continue;
                    }

                    // Portal Crossing
                    if (obs.type === 'portal_grav') {
                        if (!obs.passed && player.x > obs.x) {
                            obs.passed = true;
                            gravityInverted = !gravityInverted;
                            screenFlash = 0.8;
                        }
                    } else {
                        // Collision Check
                        let hit = false;
                        if (obs.type === 'box' || obs.type === 'gate') {
                            let left = obs.x - obs.w/2;
                            let right = obs.x + obs.w/2;
                            let top = obs.y - obs.h/2;
                            let bottom = obs.y + obs.h/2;
                            hit = (player.x + player.size > left && player.x - player.size < right &&
                                   player.y + player.size > top && player.y - player.size < bottom);
                        } else if (obs.type === 'sawblade') {
                            let dx = player.x - obs.x;
                            let dy = player.y - obs.y;
                            let dist = Math.sqrt(dx*dx + dy*dy);
                            hit = dist < (obs.r + player.size - 2); 
                        }

                        if (hit) die();
                    }
                }
                
                // Visual Updates
                globalHue = (globalHue + 0.3) % 360;
                stars.forEach(s => {
                    s.x -= s.speed * (PLAYER_SPEED / 2);
                    if(s.x < 0) { s.x = CANVAS_W; s.y = Math.random() * CANVAS_H; }
                });
                
                // Thruster particles
                if (Math.random() > 0.4) {
                    particles.push({
                        x: player.x - 12,
                        y: player.y + (isHolding ? -4 : 4),
                        vx: -Math.random() * 6 - 2,
                        vy: (Math.random() - 0.5) * 2,
                        size: Math.random() * 5 + 2,
                        color: isHolding ? '#ec4899' : '#06b6d4',
                        life: 0.8
                    });
                }
            }

            // Update Particles (Runs even in GAMEOVER)
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vx *= 0.95; // friction
                p.vy *= 0.95;
                p.life -= 0.03;
                if (p.life <= 0) particles.splice(i, 1);
            }
        }

        // --- Rendering ---

        function draw() {
            // Background
            ctx.fillStyle = '#05020a'; // Deep space purple-black
            ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

            // Draw Stars
            ctx.fillStyle = '#ffffff';
            stars.forEach(s => {
                ctx.globalAlpha = (Math.sin((Date.now() / 500) + s.x) + 1) / 2 * 0.5 + 0.1;
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.size, 0, Math.PI*2);
                ctx.fill();
            });
            ctx.globalAlpha = 1.0;

            // Draw Scrolling Grid (Speed effect)
            ctx.strokeStyle = `hsla(${globalHue}, 50%, 50%, 0.08)`;
            ctx.lineWidth = 2;
            const gridOffset = (state === 'PLAYING' ? (Date.now() / 10 * PLAYER_SPEED/8) % 50 : 0);
            for(let x = -gridOffset; x < CANVAS_W; x += 50) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, CANVAS_H); ctx.stroke();
            }
            for(let y = 0; y < CANVAS_H; y += 50) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(CANVAS_W, y); ctx.stroke();
            }

            // Draw Terrain (Walls)
            if (terrain.length > 0) {
                // Top Wall Fill
                ctx.beginPath();
                ctx.moveTo(0, 0);
                for(let i = 0; i < terrain.length; i++) {
                    ctx.lineTo(i * SEGMENT_WIDTH - terrainXOffset, terrain[i].top);
                }
                ctx.lineTo(CANVAS_W, 0);
                ctx.closePath();
                ctx.fillStyle = '#010206'; // very dark background
                ctx.fill();

                // Top Wall Neon Border
                ctx.beginPath();
                for(let i = 0; i < terrain.length; i++) {
                    ctx.lineTo(i * SEGMENT_WIDTH - terrainXOffset, terrain[i].top);
                }
                ctx.strokeStyle = `hsl(${globalHue}, 100%, 60%)`; // Dynamic Color
                ctx.lineWidth = 6;
                ctx.shadowBlur = 20;
                ctx.shadowColor = `hsl(${globalHue}, 100%, 60%)`;
                ctx.stroke();

                // Bottom Wall Fill
                ctx.beginPath();
                for(let i = 0; i < terrain.length; i++) {
                    ctx.lineTo(i * SEGMENT_WIDTH - terrainXOffset, terrain[i].bottom);
                }
                ctx.lineTo(CANVAS_W, CANVAS_H);
                ctx.lineTo(0, CANVAS_H);
                ctx.closePath();
                ctx.fillStyle = '#010206';
                ctx.fill();

                // Bottom Wall Neon Border
                ctx.beginPath();
                for(let i = 0; i < terrain.length; i++) {
                    ctx.lineTo(i * SEGMENT_WIDTH - terrainXOffset, terrain[i].bottom);
                }
                ctx.strokeStyle = `hsl(${(globalHue + 180) % 360}, 100%, 60%)`; // Complementary color
                ctx.lineWidth = 6;
                ctx.shadowBlur = 20;
                ctx.shadowColor = `hsl(${(globalHue + 180) % 360}, 100%, 60%)`;
                ctx.stroke();
                
                // Reset shadow for other elements
                ctx.shadowBlur = 0; 
            }

            // Draw Obstacles
            obstacles.forEach(obs => {
                ctx.save();
                ctx.translate(obs.x, obs.y);
                
                if (obs.type === 'box' || obs.type === 'gate') {
                    ctx.beginPath();
                    ctx.rect(-obs.w/2, -obs.h/2, obs.w, obs.h);
                    ctx.fillStyle = '#010206';
                    ctx.fill();
                    
                    ctx.strokeStyle = obs.color;
                    ctx.lineWidth = 4;
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = obs.color;
                    ctx.stroke();
                    
                    // Inner deco
                    ctx.strokeStyle = `${obs.color}44`; 
                    ctx.lineWidth = 1;
                    ctx.shadowBlur = 0;
                    ctx.strokeRect(-obs.w/2 + 6, -obs.h/2 + 6, obs.w - 12, obs.h - 12);
                    
                } else if (obs.type === 'sawblade') {
                    ctx.rotate(obs.rot);
                    ctx.beginPath();
                    for(let i=0; i<8; i++) {
                        let angle = (i / 8) * Math.PI * 2;
                        ctx.lineTo(Math.cos(angle) * obs.r, Math.sin(angle) * obs.r);
                        let nextAngle = angle + (Math.PI*2 / 16); // halfway to next
                        ctx.lineTo(Math.cos(nextAngle) * (obs.r + 8), Math.sin(nextAngle) * (obs.r + 8));
                    }
                    ctx.closePath();
                    
                    ctx.fillStyle = '#010206';
                    ctx.fill();
                    
                    ctx.strokeStyle = obs.color;
                    ctx.lineWidth = 4;
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = obs.color;
                    ctx.stroke();
                    
                    // Inner ring
                    ctx.beginPath();
                    ctx.arc(0, 0, obs.r * 0.5, 0, Math.PI*2);
                    ctx.strokeStyle = `${obs.color}88`;
                    ctx.lineWidth = 2;
                    ctx.shadowBlur = 0;
                    ctx.stroke();
                } else if (obs.type === 'portal_grav') {
                    ctx.beginPath();
                    ctx.ellipse(0, 0, obs.w/2, obs.h/2, 0, 0, Math.PI*2);
                    ctx.strokeStyle = obs.color;
                    ctx.lineWidth = 6;
                    ctx.shadowBlur = 20;
                    ctx.shadowColor = obs.color;
                    ctx.stroke();
                    
                    ctx.fillStyle = `${obs.color}33`; 
                    ctx.fill();
                    
                    // Portal inner animation
                    let pulse = (Math.sin(Date.now() / 150) + 1) / 2;
                    ctx.beginPath();
                    ctx.ellipse(0, 0, obs.w/2 * (0.6 + pulse*0.2), obs.h/2 * (0.8 + pulse*0.1), 0, 0, Math.PI*2);
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 2;
                    ctx.shadowBlur = 0;
                    ctx.stroke();
                }
                
                ctx.restore();
            });

            // Draw Trail
            if (state === 'PLAYING' && trail.length > 1) {
                ctx.beginPath();
                ctx.moveTo(trail[0].x, trail[0].y);
                for (let i = 1; i < trail.length; i++) {
                    ctx.lineTo(trail[i].x, trail[i].y);
                }
                
                // Gradient trail based on hue
                let gradient = ctx.createLinearGradient(trail[0].x, 0, trail[trail.length-1].x, 0);
                gradient.addColorStop(0, `hsla(${globalHue}, 100%, 50%, 0)`);
                gradient.addColorStop(1, `hsla(${globalHue}, 100%, 70%, 0.8)`);
                
                ctx.strokeStyle = gradient;
                ctx.lineWidth = player.size * 2.5;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                
                ctx.globalCompositeOperation = 'lighter';
                ctx.stroke();
                ctx.globalCompositeOperation = 'source-over';
            }

            // Draw Player
            if (state === 'PLAYING') {
                ctx.save();
                ctx.translate(player.x, player.y);
                
                // Rotation & Gravity handling
                let baseRot = isHolding ? -Math.PI/4 : Math.PI/4;
                if (gravityInverted) baseRot = isHolding ? Math.PI/4 : -Math.PI/4;
                ctx.rotate(baseRot);
                
                if (gravityInverted) {
                    ctx.scale(1, -1);
                }
                
                // Draw Thruster Glow
                ctx.beginPath();
                ctx.arc(-10, 0, Math.random() * 4 + 4, 0, Math.PI*2);
                ctx.fillStyle = isHolding ? '#ec4899' : '#06b6d4';
                ctx.shadowBlur = 15;
                ctx.shadowColor = ctx.fillStyle;
                ctx.globalCompositeOperation = 'lighter';
                ctx.fill();
                ctx.globalCompositeOperation = 'source-over';
                
                // Draw Dart/Arrow Shape
                ctx.beginPath();
                ctx.moveTo(16, 0);      // Tip
                ctx.lineTo(-12, 12);    // Bottom wing
                ctx.lineTo(-6, 0);      // Inner notch
                ctx.lineTo(-12, -12);   // Top wing
                ctx.closePath();
                
                ctx.fillStyle = '#ffffff'; 
                ctx.shadowBlur = 15;
                ctx.shadowColor = `hsl(${globalHue}, 100%, 70%)`;
                ctx.fill();
                
                ctx.strokeStyle = '#000000';
                ctx.lineWidth = 1;
                ctx.shadowBlur = 0;
                ctx.stroke();
                
                // Core
                ctx.beginPath();
                ctx.moveTo(8, 0);
                ctx.lineTo(-6, 4);
                ctx.lineTo(-2, 0);
                ctx.lineTo(-6, -4);
                ctx.closePath();
                ctx.fillStyle = isHolding ? '#ec4899' : '#06b6d4';
                ctx.fill();

                ctx.restore();
            }

            // Draw Particles
            ctx.globalCompositeOperation = 'lighter';
            particles.forEach(p => {
                ctx.globalAlpha = Math.max(0, p.life);
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
            });
            ctx.globalAlpha = 1.0;
            ctx.globalCompositeOperation = 'source-over';
            
            // Screen Flash Effect
            if (screenFlash > 0) {
                ctx.fillStyle = `rgba(255, 255, 255, ${screenFlash})`;
                ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
                screenFlash -= 0.03;
            }
        }

        // --- Main Game Loop ---
        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        // --- Event Listeners ---
        const handleInputDown = (e) => {
            // Prevent default zooming/scrolling on touch
            if (e.type === 'touchstart') e.preventDefault(); 
            if (state === 'PLAYING') isHolding = true;
        };

        const handleInputUp = (e) => {
            if (e.type === 'touchend') e.preventDefault();
            if (state === 'PLAYING') isHolding = false;
        };

        // Window interaction for wave mechanics
        window.addEventListener('mousedown', handleInputDown, {passive: false});
        window.addEventListener('touchstart', handleInputDown, {passive: false});
        window.addEventListener('mouseup', handleInputUp);
        window.addEventListener('touchend', handleInputUp);

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                e.preventDefault();
                handleInputDown(e);
            }
        });
        window.addEventListener('keyup', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') handleInputUp(e);
        });

        // UI Buttons
        document.getElementById('startBtn').addEventListener('click', (e) => {
            e.stopPropagation(); // Prevent immediately making wave jump
            initGame();
        });

        document.getElementById('restartBtn').addEventListener('click', (e) => {
            e.stopPropagation();
            gameOverMenu.classList.add('hidden');
            gameOverMenu.classList.remove('flex');
            initGame();
        });

        // Difficulty Selection Logic
        const diffButtons = document.querySelectorAll('.diff-btn');
        diffButtons.forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                currentDifficulty = btn.dataset.diff;
                
                // Update UI for all buttons
                diffButtons.forEach(b => {
                    const diff = b.dataset.diff;
                    if (diff === currentDifficulty) {
                        b.classList.add(DIFFICULTY_CONFIG[diff].colorBtn, 'text-slate-900');
                        b.classList.remove(DIFFICULTY_CONFIG[diff].colorText, 'hover:bg-white/10');
                    } else {
                        b.classList.remove(DIFFICULTY_CONFIG[diff].colorBtn, 'text-slate-900');
                        b.classList.add(DIFFICULTY_CONFIG[diff].colorText, 'hover:bg-white/10');
                    }
                });
            });
        });

        // Start Loop
        requestAnimationFrame(loop);
    </script>
</body>
</html>
